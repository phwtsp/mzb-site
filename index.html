<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZB Brasil | Em Construção</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,700;1,400&family=Figtree:wght@300;400;600&family=Raleway:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-coffee-dark: #241506;
            --color-blue-mzb: #036398;
            --color-text-light: #F2F2F2;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Figtree', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-coffee-dark);
            color: var(--color-text-light);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(36, 21, 6, 0.7), rgba(36, 21, 6, 0.8)), 
                        url('assets/images/aae.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
            animation: zoomBg 20s infinite alternate ease-in-out;
        }

        @keyframes zoomBg {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* Glassmorphism Card */
        .container {
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            margin-bottom: 40px;
        }

        .logo-container img {
            height: 60px;
            filter: brightness(0) invert(1); /* White logo */
            transform: scale(1);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo-container:hover img {
            transform: scale(1.1);
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 56px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            line-height: 1;
        }

        h1 strong {
            font-weight: 700;
            color: var(--color-blue-mzb);
        }

        p {
            font-size: 18px;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .status-badge {
            display: inline-block;
            padding: 10px 25px;
            background: var(--color-blue-mzb);
            color: white;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(3, 99, 152, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(3, 99, 152, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(3, 99, 152, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(3, 99, 152, 0); }
        }

        .footer-info {
            font-size: 14px;
            opacity: 0.6;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        /* Floating Coffee Beans for flair */
        .bean {
            position: absolute;
            width: 30px;
            opacity: 0.2;
            z-index: -1;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            h1 { font-size: 40px; }
            .container { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="container">
        <div class="logo-container">
            <img src="assets/images/Logo_Menu.png" alt="MZB Brasil Logo">
        </div>

        <div class="status-badge">Em breve</div>

        <h1>EM <strong>CONSTRUÇÃO</strong></h1>
        
        <p>Estamos preparando uma nova experiência</p>

        <div class="footer-info">
            &copy; <span id="year"></span> Massimo Zanetti Beverage Brasil. Todos os direitos reservados.
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
